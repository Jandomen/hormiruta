<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Hormiruta - Sin Conexión</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
        }

        body {
            background-color: #060914;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .glow {
            position: absolute;
            top: 22%;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 320px;
            background: rgba(96, 165, 250, 0.12);
            filter: blur(90px);
            border-radius: 50%;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 320px;
            padding: 16px;
        }

        .logo-box {
            width: 104px;
            height: 104px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            overflow: hidden;
        }

        .logo-box img {
            width: 68%;
            height: 68%;
            object-fit: contain;
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: -1px;
            line-height: 1.15;
            margin-bottom: 14px;
        }

        p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 14px;
            line-height: 1.6;
            font-weight: 500;
            margin-bottom: 32px;
            padding: 0 8px;
        }

        .btn {
            background: linear-gradient(135deg, #60a5fa, #4f46e5);
            color: #060914;
            border: none;
            padding: 16px 20px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(96, 165, 250, 0.25);
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .btn:active { transform: scale(0.96); }

        .footer {
            margin-top: 36px;
            font-size: 10px;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.18);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        @media (max-width: 340px) {
            .logo-box { width: 88px; height: 88px; border-radius: 28px; margin-bottom: 24px; }
            h1 { font-size: 22px; }
            p { font-size: 13px; }
        }
    </style>
</head>

        <h1>Sin Conexión a Internet</h1>
        <p>Comprueba tu conexión e inténtalo nuevamente.</p>
        <button id="retryBtn" class="btn" onclick="handleRetry()">Reintentar</button>
        <p id="retryHint" style="display:none;margin-top:16px;font-size:13px;color:rgba(255,255,255,0.6);font-weight:500;line-height:1.5;">Sigue sin conexión. Verifica tu internet e inténtalo nuevamente.</p>

    <script>
        function handleRetry() {
            if (navigator.onLine) {
                window.location.reload();
                return;
            }
            var hint = document.getElementById('retryHint');
            if (hint) hint.style.display = 'block';
        }

        // Recuperación automática: al volver la conexión se recarga la app.
        window.addEventListener('online', function () {
            window.location.reload();
        });
